<!doctype html><meta charset="utf-8"><title>ui-test</title>
<body><pre id="out">running…</pre><iframe id="f" src="../index.html?nosw=1" style="width:900px;height:900px"></iframe>
<script>
const out=[]; const log=(ok,msg)=>{out.push((ok?'PASS ':'FAIL ')+msg); document.getElementById('out').textContent=out.join('\n');};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const W=()=>f.contentWindow, D=()=>f.contentDocument;
async function ev_recreate(){ await until(()=>W().BWSCore,'core'); const C=W().BWSCore; const r=C.newRecord(1,W().BWS_DESIGN); r.demo={name:'Test Patient',age:'28',interviewer:'Anshul'}; r.apais={1:3,2:3,3:4,4:3,5:2,6:5}; for(let i=1;i<=12;i++){const t=r.tasks[i];t.best=t.options[0];t.worst=t.options[3];} r.status='complete'; const recs=JSON.parse(W().localStorage.getItem('bws.records.v1')||'{}'); recs[1]=r; W().localStorage.setItem('bws.records.v1',JSON.stringify(recs)); f.src='../index.html?nosw=3'; await sleep(200); await until(()=>D().querySelector('.plist li'),'home after recreate'); }
async function until(fn,label,ms=4000){const t0=Date.now();while(Date.now()-t0<ms){try{const v=fn();if(v)return v;}catch(e){}await sleep(25);}throw new Error('timeout: '+label);}
function setInput(el,val){el.value=val;el.dispatchEvent(new (W().Event)('input',{bubbles:true}));}
(async()=>{try{
  await until(()=>D().querySelector('[data-act="new"]'),'home');
  log(true,'home rendered; next id button: '+D().querySelector('[data-act="new"]').textContent.trim());
  log(W().getComputedStyle(D().querySelector('#toast')).display==='none','toast is invisible when there is no message');
  D().querySelector('[data-act="new"]').click();
  await until(()=>D().querySelector('#demo-form'),'demo form');
  const vals={age:'28',admission_date:'2026-09-01',surgery_date:'2026-09-03',height_cm:'156',weight_kg:'68',indication_cs:'Previous CS',asa_grade:'II',education:'Graduate',occupation:'Homemaker',monthly_income_inr:'25000',parity:'1',live_issues:'1',previous_cs:'Yes',other_surgery:'No',administration_mode:'Interviewer-administered (Hindi)',interviewer:'AR'};
  // submit empty first -> should stay with errors
  D().querySelector('#demo-form button[type=submit]').click(); await sleep(100);
  log(!!D().querySelector('.field.err'),'empty proforma submit shows validation errors');
  for(const [k,v] of Object.entries(vals)){ const el=D().querySelector('[name="'+k+'"]'); if(!el){log(false,'missing field '+k);continue;} setInput(el,v); if(el.tagName==='SELECT') await sleep(60); }
  await sleep(60);
  log(!!D().querySelector('[name="previous_cs_count"]'),'conditional field previous_cs_count appears after previous_cs=Yes');
  setInput(D().querySelector('[name="previous_cs_count"]'),'1');
  log(!!D().querySelector('[name="name"]'),'name field shown by default');
  setInput(D().querySelector('[name="name"]'),'Test Patient');
  log(true,'fields filled; form present='+!!D().querySelector('#demo-form')+' view text='+D().querySelector('.bar h1').textContent);
  D().querySelector('#demo-form button[type=submit]').click();
  await until(()=>D().querySelector('.scale'),'apais');
  log(true,'APAIS screen reached');
  log(D().querySelector('[data-act="next"]').disabled,'APAIS continue disabled before answers');
  for(const [q,v] of [[1,3],[2,3],[3,4],[4,3],[5,2],[6,5]]){ D().querySelector('.opt[data-q="'+q+'"][data-v="'+v+'"]').click(); await sleep(40); }
  log(!D().querySelector('[data-act="next"]').disabled,'APAIS continue enabled after 6 answers');
  log(D().body.textContent.includes('Anxiety score 11/20 (high, ≥11)'),'APAIS score shown = 11 high');
  D().querySelector('[data-act="next"]').click();
  await until(()=>D().querySelector('[data-act="start"]'),'intro'); D().querySelector('[data-act="start"]').click();
  await until(()=>D().querySelector('.trow'),'task 1');
  // task 1 for pid 1 must show O09,O11,O03,O05 in that order
  const shown=[...D().querySelectorAll('.choice.best')].map(b=>b.dataset.oid).join(',');
  log(shown==='O09,O11,O03,O05','task 1 option order matches CSV row 1: '+shown);
  log(D().querySelector('[data-act="next"]').disabled,'Next disabled before choices');
  D().querySelectorAll('.choice.best')[0].click(); await sleep(40);
  log(D().querySelectorAll('.choice.worst')[0].disabled,'worst button of the chosen-best row is disabled');
  log(D().querySelector('[data-act="next"]').disabled,'Next still disabled with only best chosen');
  for(let i=1;i<=12;i++){
    await until(()=>D().querySelector('.bar h1').textContent.includes('सवाल '+i+' /'),'task '+i);
    const bests=D().querySelectorAll('.choice.best');
    if(!bests[0].classList.contains('sel')){bests[0].click(); await sleep(30);}
    D().querySelectorAll('.choice.worst')[3].click(); await sleep(30);
    D().querySelector('[data-act="next"]').click(); await sleep(60);
  }
  await until(()=>D().body.textContent.includes('Interview complete'),'review');
  log(true,'review screen: interview complete');
  const rec=W().BWSApp.records[1];
  log(rec.status==='complete'&&Object.values(rec.tasks).every(t=>t.best&&t.worst&&t.best!==t.worst),'record complete with 12 valid best/worst pairs');
  log(rec.tasks[1].best==='O09'&&rec.tasks[1].worst==='O05','task1 best O09 worst O05 stored');
  log(!!rec.tasks[5].startedAt&&!!rec.tasks[5].completedAt,'timestamps recorded');
  const ls=JSON.parse(W().localStorage.getItem('bws.records.v1')); log(ls&&ls[1]&&ls[1].status==='complete','localStorage copy present');
  const idbOK=await new Promise(res=>{const rq=W().indexedDB.open('bws-db',1);rq.onsuccess=()=>{const g=rq.result.transaction('kv').objectStore('kv').get('records');g.onsuccess=()=>res(!!(g.result&&g.result[1]&&g.result[1].status==='complete'));g.onerror=()=>res(false);};rq.onerror=()=>res(false);});
  log(idbOK,'IndexedDB copy present');
  const C=W().BWSCore; const csv=C.buildCombined(W().BWSApp.records,W().BWSApp.settings).split('\r\n').filter(Boolean);
  log(csv.length===49&&csv[0].includes(',name,')&&csv[1].includes('Test Patient'),'combined CSV has 48 rows incl. name for one participant');
  // reload iframe -> persistence
  f.src='../index.html?nosw=2'; await sleep(200);
  await until(()=>D().querySelector('.plist li'),'home after reload');
  const li=D().querySelector('.plist li').textContent;
  log(li.includes('Test Patient')&&li.includes('(ID 1)')&&li.includes('Complete')&&li.includes('12/12'),'after reload participant listed as name (ID 1): '+li.replace(/\s+/g,' ').trim());
  // search bar
  const sq=D().querySelector('#search'); log(!!sq,'search field present');
  setInput(sq,'test pat'); await sleep(60);
  log(D().querySelectorAll('.plist li').length===1&&D().querySelector('.plist li mark')&&D().body.textContent.includes('1 match'),'search "test pat" -> 1 highlighted match with count');
  setInput(sq,'zzzz'); await sleep(60);
  log(!D().querySelector('.plist li')&&D().body.textContent.includes('No matches for'),'no-match state');
  setInput(sq,'1'); await sleep(60);
  log(D().querySelectorAll('.plist li').length===1&&D().querySelector('.plist li').dataset.pid==='1','numeric search by ID finds participant 1');
  D().querySelector('[data-act="clear-search"]').click(); await sleep(60);
  log(sq.value===''&&D().querySelectorAll('.plist li').length===1&&!D().body.textContent.includes('match ·'),'clear button restores full list');
  log(D().body.textContent.includes('not backed up'),'unexported banner shown');
  // delete flow: list row -> summary -> danger zone -> typed ID
  D().querySelector('.plist li[data-pid="1"]').click(); await until(()=>D().querySelector('[data-act="delete"]'),'summary with delete');
  log(D().body.textContent.includes('Interview complete'),'list row opens the summary screen');
  D().querySelector('[data-act="delete"]').click(); await until(()=>D().querySelector('.sheet'),'delete dialog');
  log(D().querySelector('.sheet [data-dlg="ok"]').disabled&&D().querySelector('.sheet').textContent.includes('not in any backup'),'delete dialog warns when not backed up, confirm disabled');
  setInput(D().querySelector('#dlg-in'),'2'); await sleep(30); log(D().querySelector('.sheet [data-dlg="ok"]').disabled,'wrong ID keeps delete disabled');
  D().querySelector('.sheet [data-dlg="cancel"]').click(); await sleep(50); log(!!W().BWSApp.records[1],'cancel keeps the participant');
  D().querySelector('[data-act="delete"]').click(); await until(()=>D().querySelector('.sheet'),'delete dialog 2');
  setInput(D().querySelector('#dlg-in'),'1'); await sleep(30); D().querySelector('.sheet [data-dlg="ok"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home after delete');
  log(!W().BWSApp.records[1]&&D().querySelector('[data-act="new"]').textContent.includes('ID 1'),'participant deleted and ID 1 released for reuse');
  log(JSON.parse(W().localStorage.getItem('bws.deleted.v1')).length===1,'deletion logged');
  // recreate participant 1 so the remaining checks keep their assumptions
  await ev_recreate();
  log(D().querySelector('[data-act="new"]').textContent.includes('ID 2'),'next id is 2');
  // export limit: create 2nd participant quickly -> blocked state check via settings default 2
  log(W().BWSApp.settings.exportLimit===5&&W().BWSApp.settings.interviewer==='Anshul'&&W().BWSApp.settings.recordName===true&&W().BWSApp.settings.theme==='auto','defaults: export limit 5, interviewer Anshul, name on, theme auto');
  // CSV export must NOT clear the not-backed-up state
  W().navigator.share=undefined; W().HTMLAnchorElement.prototype.click=function(){};
  D().querySelector('[data-act="export"]').click(); await sleep(700);
  log(W().BWSCore.unexportedCount(W().BWSApp.records)===1&&D().body.textContent.includes('not backed up'),'CSV export does not count as a backup');
  D().querySelector('[data-act="backup"]').click(); await sleep(700);
  log(W().BWSCore.unexportedCount(W().BWSApp.records)===0&&!D().body.textContent.includes('not backed up'),'Save backup clears the not-backed-up state');
  // back gesture + history: open settings, browser back returns home; synthetic edge swipe on proforma returns home
  D().querySelector('[data-act="settings"]').click(); await until(()=>D().querySelector('.seg'),'settings for back');
  W().history.back(); await until(()=>D().querySelector('[data-act="new"]'),'home via history.back');
  log(true,'browser back returns to Home');
  D().querySelector('.plist li[data-pid="1"]').click(); await until(()=>D().querySelector('[data-act="delete"]'),'summary for swipe');
  const touch=(type,x,y)=>{const T=W().Touch, TE=W().TouchEvent; const tgt=D().body; const t=new T({identifier:1,target:tgt,clientX:x,clientY:y}); const init={bubbles:true,cancelable:true,touches:type==='touchend'?[]:[t],changedTouches:[t],targetTouches:type==='touchend'?[]:[t]}; D().dispatchEvent(new TE(type,init));};
  touch('touchstart',6,400); touch('touchmove',40,402); touch('touchmove',200,405); touch('touchend',260,405);
  await until(()=>D().querySelector('[data-act="new"]'),'home via edge swipe',1500);
  log(true,'edge swipe from the left returns to Home');
  D().querySelector('.plist li[data-pid="1"]').click(); await until(()=>D().querySelector('[data-act="delete"]'),'summary for short swipe');
  touch('touchstart',6,400); touch('touchmove',30,402); touch('touchend',40,402); await sleep(300);
  log(!!D().querySelector('[data-act="delete"]'),'short swipe snaps back and stays on the screen');
  touch('touchstart',200,400); touch('touchmove',400,402); touch('touchend',420,402); await sleep(300);
  log(!!D().querySelector('[data-act="delete"]'),'swipe not starting at the edge is ignored');
  D().querySelector('[data-act="home"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home');
  // theme toggle in settings
  D().querySelector('[data-act="settings"]').click(); await until(()=>D().querySelector('.seg'),'settings');
  D().querySelector('.seg [data-theme="dark"]').click(); await sleep(100);
  log(D().documentElement.dataset.theme==='dark'&&W().BWSApp.settings.theme==='dark'&&D().querySelector('.seg [data-theme="dark"]').classList.contains('sel'),'dark theme applied and saved');
  log(JSON.parse(W().localStorage.getItem('bws.settings.v1')).theme==='dark','theme persisted');
  D().querySelector('.seg [data-theme="auto"]').click(); await sleep(100);
  log(!D().documentElement.dataset.theme,'system theme removes override');
  D().querySelector('[data-act="home"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home');
  log(!D().querySelector('[data-act="new"]').disabled,'new participant not blocked with 1 of 5 un-backed-up');
  // factory reset: cancelled confirm keeps data; RESET erases records and settings
  D().querySelector('[data-act="settings"]').click(); await until(()=>D().querySelector('[data-act="wipe"]'),'settings');
  D().querySelector('[data-act="wipe"]').click(); await until(()=>D().querySelector('.sheet'),'reset dialog');
  log(D().querySelector('.sheet [data-dlg="ok"]').disabled&&D().querySelector('.sheet').textContent.includes('1 participant'),'reset dialog opens with confirm disabled and count');
  D().querySelector('.sheet [data-dlg="cancel"]').click(); await sleep(50);
  log(!D().querySelector('.sheet')&&Object.keys(W().BWSApp.records).length===1,'reset cancelled keeps data');
  D().querySelector('[data-act="wipe"]').click(); await until(()=>D().querySelector('.sheet'),'reset dialog 2');
  setInput(D().querySelector('#dlg-in'),'nope'); await sleep(30);
  log(D().querySelector('.sheet [data-dlg="ok"]').disabled,'wrong word keeps confirm disabled');
  setInput(D().querySelector('#dlg-in'),'reset'); await sleep(30);
  log(!D().querySelector('.sheet [data-dlg="ok"]').disabled,'typed RESET (any case) enables confirm');
  D().querySelector('.sheet [data-dlg="ok"]').click(); await sleep(200);
  log(Object.keys(W().BWSApp.records).length===0&&!D().querySelector('.plist li'),'factory reset erased all records');
  log(!JSON.parse(W().localStorage.getItem('bws.records.v1')||'{}')[1],'localStorage cleared by reset');
  // after reset: an untouched new form is discarded when leaving; a partial one is kept and blocks the next
  await until(()=>D().querySelector('[data-act="new"]'),'home after reset');
  D().querySelector('[data-act="new"]').click(); await until(()=>D().querySelector('#demo-form'),'demo for empty');
  D().querySelector('[data-act="home"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home');
  log(!D().querySelector('.plist li')&&D().querySelector('[data-act="new"]').textContent.includes('ID 1'),'untouched form discarded, ID 1 released');
  D().querySelector('[data-act="new"]').click(); await until(()=>D().querySelector('#demo-form'),'demo for partial');
  setInput(D().querySelector('[name="age"]'),'31'); await sleep(50);
  log(D().querySelector('[data-act="home"]').textContent.includes('Save & exit'),'Save & exit label on proforma');
  D().querySelector('[data-act="home"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home');
  const resume=D().querySelector('.secondary.big');
  log(resume&&resume.textContent.includes('Resume ID 1')&&!resume.textContent.includes('('),'partial record shown as resumable: '+(resume?resume.textContent.replace(/\s+/g,' ').trim():'none'));
  log(D().body.textContent.includes('not backed up')&&!D().querySelector('[data-act="new"]').disabled,'partial record counted in banner, not yet blocking at 1/5');
  W().BWSApp.settings.exportLimit=1; D().querySelector('[data-act="settings"]').click(); await sleep(50); D().querySelector('[data-act="home"]').click(); await until(()=>D().querySelector('[data-act="new"]'),'home');
  log(D().querySelector('[data-act="new"]').disabled,'block engages when pending count reaches the limit');
  log(true,'DONE');
}catch(e){log(false,'EXC '+e.message);log(true,'DONE');}})();
</script></body>
