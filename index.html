<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CS Preference BWS</title>
<meta name="description" content="Offline data collection for the best-worst scaling study of patient priorities during elective caesarean delivery">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CS BWS">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{--blue:#0f4c81;--green:#1e7f4f;--red:#b3261e;--amber:#9a6700;--grey:#6b7280;--bg:#f4f6f9;--card:#fff;--line:#e3e7ee}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#111;font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
  body{padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:820px;margin:0 auto;padding:0 12px 24px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 4px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
  .bar h1{font-size:19px;margin:0;flex:1;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:17px;margin:0 0 10px} h2 small{color:var(--grey);font-weight:normal}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.secondary{background:#e8f0fa;border-color:#c9daf0;color:var(--blue)}
  button.big{width:100%;font-size:18px;margin:6px 0;min-height:56px}
  button.link{border:none;background:none;color:var(--blue);padding:8px}
  button.danger-link{border:none;background:none;color:var(--red);padding:10px 0;width:100%;text-align:left}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .row3 button small{color:var(--grey);font-weight:normal}
  .banner{border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .banner-amber{background:#fff4d6;border:1px solid #f1d27a;color:#5c3d00}
  .banner-red{background:#fde8e6;border:1px solid #f3b2ad;color:#7a1a14}
  .banner button{margin-left:auto}
  .banner-line{flex-wrap:nowrap;padding:8px 12px} .banner-line span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .banner-line button{white-space:nowrap;min-height:40px;padding:8px 12px;flex:none}
  .secondary.big small{font-weight:normal;font-size:13px}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:middle}
  .pill-green{background:var(--green)} .pill-amber{background:var(--amber)} .pill-grey{background:var(--grey)}
  .plist{list-style:none;margin:0;padding:0} .plist li{padding:12px 6px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer}
  .plist li:first-child{border-top:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-left:auto}
  .muted{color:var(--grey)} .small{font-size:13px}
  footer{text-align:center;margin-top:18px}
  .field{display:block;margin:0 0 12px} .field>span{display:block;font-size:14px;color:#333;margin-bottom:4px} .field em{color:var(--grey);font-style:normal}
  .field input,.field select{width:100%;font:inherit;padding:12px;border:1px solid #cfd6e0;border-radius:10px;background:#fff;min-height:48px}
  .field.err input,.field.err select{border-color:var(--red);background:#fff7f6} .errmsg{color:var(--red)}
  .check{display:block;margin:12px 0}
  .hi{font-family:-apple-system,"Kohinoor Devanagari","Devanagari Sangam MN","Noto Sans Devanagari",system-ui,sans-serif}
  .en{display:block;color:var(--grey);font-size:14px}
  .big-text{font-size:21px;line-height:1.5}
  .q{border-top:1px solid var(--line);padding:12px 0} .q p{margin:0 0 6px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .opt{display:flex;flex-direction:column;align-items:center;padding:8px 4px;min-height:74px;font-size:13px;line-height:1.2}
  .opt b{font-size:18px} .opt .en{font-size:11px}
  .opt.sel{background:var(--blue);color:#fff;border-color:var(--blue)} .opt.sel .en{color:#dbe7f5}
  .progress{height:6px;background:#dde3ec;border-radius:3px;overflow:hidden;margin:4px 0 6px} .progress div{height:100%;background:var(--blue)}
  .thead{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;text-align:center;font-size:14px;color:#333;padding-bottom:6px}
  .thead small{color:var(--grey)}
  .trow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
  .trow.is-best{background:#eaf6ef} .trow.is-worst{background:#fbeeed}
  .otext{display:flex;flex-direction:column;gap:2px;padding-left:6px}
  .choice{min-height:64px;font-size:26px;border-radius:14px}
  .choice.best.sel{background:var(--green);color:#fff;border-color:var(--green)}
  .choice.worst.sel{background:var(--red);color:#fff;border-color:var(--red)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px} .nav button{flex:1;min-height:56px;font-size:18px}
  table.mini{width:100%;border-collapse:collapse;font-size:14px} .mini th,.mini td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)} .mini th{border-top:none;color:var(--grey);font-weight:normal}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:92vw}
  #storage-warning{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;padding:6px;font-size:14px;z-index:10}
  @media (max-width:480px){.thead,.trow{grid-template-columns:1fr 64px 64px}.choice{min-height:56px;font-size:22px}.big-text{font-size:19px}.row3{grid-template-columns:1fr 1fr}.row3 button:last-child{grid-column:span 2}}
</style>
</head>
<body>
<div id="storage-warning" hidden></div>
<div id="app"><p style="padding:40px;text-align:center;color:#6b7280">Loading…</p></div>
<div id="toast" hidden></div>
<noscript><p style="padding:20px">This app needs JavaScript enabled in Safari (Settings › Safari › Advanced › JavaScript).</p></noscript>
<script src="./design.js"></script>
<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
